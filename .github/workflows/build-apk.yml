name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create temporary debug keystore
        working-directory: android
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping."
          else
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp android/app/build/outputs/apk/debug/app-debug.apk "${TMP_DIR}/app-debug.apk"
          echo "apk_path=${TMP_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.apk_path }}"

          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Automated debug APK build for testing purposes."

      - name: Report APK download result
        if: always()
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          echo "## DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
          echo "Download the latest debug APK directly: [$DIRECT_URL]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
