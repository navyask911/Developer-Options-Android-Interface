name: Build and Sign Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Prepare Upload Keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'androidrelease123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease123' }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Using existing repository secret keystore."
          else
            echo "No secret provided. Generating fallback upload keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Developer Options, OU=Mobile, O=Utility, L=Bangalore, ST=Karnataka, C=IN"
          fi

      - name: Build Release Bundle
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'androidrelease123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease123' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Sign Android App Bundle (if unsigned)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'androidrelease123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease123' }}
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            if jarsigner -verify "$AAB_FILE" | grep -q "jar verified"; then
              echo "AAB is already signed by Gradle."
            else
              echo "Signing AAB with jarsigner..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore app/release.keystore \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                "$AAB_FILE" "$KEY_ALIAS"
            fi
          fi

      - name: Export Upload Certificate (for Google Play Console)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'androidrelease123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          keytool -export -rfc \
            -keystore app/release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -file app/upload_certificate.pem

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playstore-release-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/upload_certificate.pem
          retention-days: 14
