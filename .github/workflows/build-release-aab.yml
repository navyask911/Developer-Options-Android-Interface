name: Build Release AAB

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Prepare Upload Keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Using existing repository secret keystore."
          else
            echo "No secret provided. Generating Play Console-compliant RSA 2048 upload keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease123 \
              -keypass androidrelease123 \
              -dname "CN=Developer Options, OU=Mobile, O=Utility, L=Bangalore, ST=Karnataka, C=IN"
          fi

      - name: Build Release Bundle
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'androidrelease123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease123' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Sign Android App Bundle with jarsigner
        working-directory: android
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore app/release.keystore \
              -storepass androidrelease123 \
              -keypass androidrelease123 \
              "$AAB_FILE" upload
            echo "AAB successfully signed with upload key."
          fi

      - name: Export Upload Certificate (for Google Play Console)
        working-directory: android
        run: |
          keytool -export -rfc \
            -keystore app/release.keystore \
            -alias upload \
            -storepass androidrelease123 \
            -file app/upload_certificate.pem

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playstore-release-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/release.keystore
            android/app/upload_certificate.pem
          retention-days: 14
